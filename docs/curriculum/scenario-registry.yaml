# ============================================================
# SCENARIO REGISTRY — English speaking app for Thai learners
# 121 scenarios across 16 life domains, tiered A1–B2
# ------------------------------------------------------------
# This is the curriculum backbone. Each entry is one generation
# run through the pipeline in scenario-unit-generation-spec.md.
#
# FIELD MAPPING to the spec's registry format:
#   id     -> scenario_id
#   en/th  -> title_en / title_th
#   tier   -> tier (1 survival … 4 fluency)
#   cefr   -> cefr_range (always spans >=2 levels: scripted -> off-script)
#   sounds -> sound_targets (the Thai L1 errors THIS scenario stresses)
#   hook   -> killer_contrast + local_context, condensed
#
# NOT authored here (the generator proposes, human reviews):
#   sub_steps, vocabulary, dialogues, drills, rubric, culture note.
#
# ⚠️ THAI STRINGS ARE FIRST-DRAFT. Every `th:` value must be
#    checked by a native speaker before it reaches the product.
#
# sound_targets vocabulary:
#   r_l, str_cluster, clusters, final_consonants, th, numbers,
#   word_stress, weak_forms, intonation, vowel_glides, no_visual
# ============================================================

