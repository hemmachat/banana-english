# ============================================================
# LOCALE PACK — AUSTRALIA  (locale: en-AU)
# ------------------------------------------------------------
# Layer B config + Layer C country-specific scenarios.
# Combine with the ~110 invariant core scenarios from
# scenario-registry.yaml (minus the dropped Thailand items).
#
# Same field format as the core registry:
#   id / en / th / tier / cefr / sounds / hook
# Feeds the generation pipeline with locale + locale_context.
#
# ⚠️ Thai strings = first-draft, need native review.
# ⚠️ AU system facts = author-level knowledge, need a local
#    review pass before shipping (details change).
# ============================================================

config:
  locale: en-AU
  model_accent: Australian English      # TTS voices + pronunciation targets
  spelling: en-AU                       # organise, colour, centre, enrolment
  currency: "AUD ($)"
  number_format: "1,234.56"
  date_format: DD/MM/YYYY
  emergency_number: "000"
  transit_cards: [Opal (NSW), Myki (VIC), Go card (QLD), Metrocard (SA)]
  politeness_note: >
    Casual register is the norm; first names are common even with officials;
    "no worries", "how ya going", "cheers" are everyday. Directness is fine
    and expected — under-reporting to avoid trouble can backfire.

# ---------- DROP from core for AU (replaced below) ----------
drops_from_core:
  - ninety_day_reporting        # Thailand-resident
  - immigration_visa_extension  # Thailand version
  - work_permit_office          # Thailand version
  - bts_mrt_skytrain            # -> au_public_transport_ticketing
  - motorbike_taxi_songthaew    # no AU equivalent

